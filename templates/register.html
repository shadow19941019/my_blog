{% include "header.html" %}<h1>Register</h1>
<form method="post">{{ form.hidden_tag() }}
    {% for field in [form.email, form.password, form.name] %}
    <div class="mb-3">{{ field.label(class_="form-label") }}{{ field(class_="form-control") }}</div>
    {% endfor %}{{ form.submit(class_="btn btn-primary") }}
</form>{% include "footer.html" %}
